<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Analysis Dashboard</title>
  <link rel="stylesheet" href="./styles.css?v=5.0">
  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <div id="loading-screen" class="screen">
    <div class="spinner"></div>
    <p id="loading-status">Loading dashboard…</p>
  </div>

  <div id="login-screen" class="screen" hidden>
    <div class="login-card">
      <div class="login-logo"><img src="./assets/logo_big.png" alt="Dsquares"></div>
      <h3>Support Analysis Dashboard</h3>
      <p>Enter your access key to continue</p>
      <input type="password" id="login-key" placeholder="Access Key">
      <button id="login-btn">Sign In</button>
      <p id="login-error" class="error-msg" hidden>Invalid access key</p>
    </div>
  </div>

  <div id="app" hidden>
    <div id="sidebar" class="sidebar"></div>
    <div class="main-content">
      <div id="dashboard-header"></div>
      <div id="tabbar" class="tabbar"></div>
      <div id="content" class="content"></div>
    </div>
  </div>

  <script src="./app.js?v=5.0"></script>
</body>
</html>
